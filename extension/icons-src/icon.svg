<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Sitecraft icon: a browser window, a dashed selection box, a magic wand and sparkles. -->
  <defs>
    <linearGradient id="pill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F7BF5"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <clipPath id="win">
      <rect x="6" y="12" width="86" height="78" rx="11"/>
    </clipPath>
  </defs>

  <!-- window body -->
  <rect x="6" y="12" width="86" height="78" rx="11" fill="#FFFFFF"/>
  <!-- title bar -->
  <rect x="6" y="12" width="86" height="20" fill="#2F7BF5" clip-path="url(#win)"/>
  <circle cx="17" cy="22" r="2.7" fill="#FFFFFF"/>
  <circle cx="25.5" cy="22" r="2.7" fill="#FFFFFF"/>
  <circle cx="34" cy="22" r="2.7" fill="#FFFFFF"/>
  <!-- page content -->
  <rect x="16" y="41" width="32" height="24" rx="5" fill="#CBD5E1"/>
  <rect x="55" y="43" width="26" height="6" rx="3" fill="#E2E8F0"/>
  <rect x="55" y="54" width="20" height="6" rx="3" fill="#E2E8F0"/>
  <rect x="16" y="72" width="24" height="9" rx="4.5" fill="url(#pill)"/>
  <!-- window outline -->
  <rect x="6" y="12" width="86" height="78" rx="11" fill="none" stroke="#2F7BF5" stroke-width="5"/>

  <!-- dashed selection box -->
  <rect x="60" y="52" width="60" height="62" rx="9" fill="#FFFFFF" fill-opacity="0.75"/>
  <rect x="60" y="52" width="60" height="62" rx="9" fill="none" stroke="#2F7BF5" stroke-width="3.5" stroke-dasharray="8 6" stroke-linecap="round"/>

  <!-- wand -->
  <line x1="72" y1="110" x2="101" y2="81" stroke="#1E2748" stroke-width="10" stroke-linecap="round"/>
  <line x1="102" y1="80" x2="107" y2="75" stroke="#A5B4FC" stroke-width="10" stroke-linecap="round"/>

  <!-- sparkles -->
  <path d="M104 50 Q104 65 119 65 Q104 65 104 80 Q104 65 89 65 Q104 65 104 50 Z" fill="#7C3AED"/>
  <path d="M120 78 Q120 85 127 85 Q120 85 120 92 Q120 85 113 85 Q120 85 120 78 Z" fill="#22D3EE"/>
</svg>
